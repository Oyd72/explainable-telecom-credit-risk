services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8000:8000"

  stakeholder-dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    ports:
      - "8501:8501"

  monitoring-dashboard:
    build:
      context: .
      dockerfile: Dockerfile.monitoring
    ports:
      - "8502:8502"
