services:
  - type: web
    name: explainable-telecom-credit-risk-api
    runtime: python
    plan: free
    autoDeploy: true
    buildCommand: pip install -r requirements-serving.txt && python scripts/build_deployment_model.py
    startCommand: uvicorn src.api.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /ready
