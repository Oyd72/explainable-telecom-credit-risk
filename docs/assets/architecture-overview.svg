<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420">
  <rect width="1200" height="420" fill="#ffffff"/>
  <style>
    .box{fill:#f7f8fa;stroke:#24292f;stroke-width:2;rx:14}
    .title{font:700 24px system-ui,Segoe UI,Arial;fill:#111827}
    .label{font:600 18px system-ui,Segoe UI,Arial;fill:#111827}
    .small{font:400 15px system-ui,Segoe UI,Arial;fill:#4b5563}
    .arrow{stroke:#6b7280;stroke-width:3;fill:none;marker-end:url(#arrow)}
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#6b7280"/>
    </marker>
  </defs>
  <text x="40" y="45" class="title">Project architecture</text>

  <rect x="40" y="100" width="180" height="92" class="box"/>
  <text x="130" y="135" text-anchor="middle" class="label">Public Kaggle data</text>
  <text x="130" y="162" text-anchor="middle" class="small">raw CSV kept outside GitHub</text>

  <rect x="275" y="100" width="180" height="92" class="box"/>
  <text x="365" y="135" text-anchor="middle" class="label">Validated pipeline</text>
  <text x="365" y="162" text-anchor="middle" class="small">cleaning · checks · chronology</text>

  <rect x="510" y="100" width="180" height="92" class="box"/>
  <text x="600" y="135" text-anchor="middle" class="label">Model-ready data</text>
  <text x="600" y="162" text-anchor="middle" class="small">identifier removed</text>

  <rect x="745" y="100" width="180" height="92" class="box"/>
  <text x="835" y="135" text-anchor="middle" class="label">Model + calibration</text>
  <text x="835" y="162" text-anchor="middle" class="small">Random Forest · isotonic</text>

  <rect x="980" y="62" width="180" height="92" class="box"/>
  <text x="1070" y="97" text-anchor="middle" class="label">FastAPI</text>
  <text x="1070" y="124" text-anchor="middle" class="small">serving layer</text>

  <rect x="980" y="175" width="180" height="92" class="box"/>
  <text x="1070" y="210" text-anchor="middle" class="label">Explainability</text>
  <text x="1070" y="237" text-anchor="middle" class="small">SHAP · counterfactuals</text>

  <rect x="745" y="285" width="180" height="92" class="box"/>
  <text x="835" y="320" text-anchor="middle" class="label">Monitoring</text>
  <text x="835" y="347" text-anchor="middle" class="small">drift · performance · limits</text>

  <rect x="980" y="285" width="180" height="92" class="box"/>
  <text x="1070" y="320" text-anchor="middle" class="label">Dashboards</text>
  <text x="1070" y="347" text-anchor="middle" class="small">stakeholder · monitoring</text>

  <path d="M220 146 H275" class="arrow"/>
  <path d="M455 146 H510" class="arrow"/>
  <path d="M690 146 H745" class="arrow"/>
  <path d="M925 126 C955 126 955 108 980 108" class="arrow"/>
  <path d="M925 162 C955 162 955 220 980 220" class="arrow"/>
  <path d="M600 192 V331 H745" class="arrow"/>
  <path d="M925 331 H980" class="arrow"/>
</svg>