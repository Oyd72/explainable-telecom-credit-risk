<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470">
  <rect width="1200" height="470" fill="#ffffff"/>
  <style>
    .title{font:700 24px system-ui,Segoe UI,Arial;fill:#111827}
    .metric{font:700 34px system-ui,Segoe UI,Arial;fill:#111827}
    .label{font:600 17px system-ui,Segoe UI,Arial;fill:#374151}
    .small{font:400 15px system-ui,Segoe UI,Arial;fill:#4b5563}
    .card{fill:#f7f8fa;stroke:#d1d5db;stroke-width:1.5;rx:14}
    .barbg{fill:#e5e7eb}
    .bar{fill:#6b7280}
    .watch{fill:#9ca3af}
    .esc{fill:#4b5563}
  </style>
  <text x="40" y="45" class="title">Monitoring snapshot</text>

  <rect x="40" y="75" width="250" height="120" class="card"/>
  <text x="65" y="110" class="label">Prediction PSI</text>
  <text x="65" y="155" class="metric">0.168</text>
  <text x="65" y="180" class="small">watch range</text>

  <rect x="315" y="75" width="250" height="120" class="card"/>
  <text x="340" y="110" class="label">Holdout ROC-AUC</text>
  <text x="340" y="155" class="metric">0.829</text>
  <text x="340" y="180" class="small">performance remains useful</text>

  <rect x="590" y="75" width="250" height="120" class="card"/>
  <text x="615" y="110" class="label">Top-20% capture</text>
  <text x="615" y="155" class="metric">54.1%</text>
  <text x="615" y="180" class="small">of observed delinquencies</text>

  <rect x="865" y="75" width="295" height="120" class="card"/>
  <text x="890" y="110" class="label">Overall drift status</text>
  <text x="890" y="155" class="metric">ESCALATE</text>
  <text x="890" y="180" class="small">6 features above PSI 0.25</text>

  <text x="40" y="245" class="label">Feature PSI</text>

  <text x="40" y="285" class="small">daily_decr90</text>
  <rect x="200" y="268" width="850" height="18" class="barbg"/>
  <rect x="200" y="268" width="824" height="18" class="esc"/>
  <text x="1070" y="283" class="small">2.907</text>

  <text x="40" y="325" class="small">daily_decr30</text>
  <rect x="200" y="308" width="850" height="18" class="barbg"/>
  <rect x="200" y="308" width="820" height="18" class="esc"/>
  <text x="1070" y="323" class="small">2.890</text>

  <text x="40" y="365" class="small">rental30</text>
  <rect x="200" y="348" width="850" height="18" class="barbg"/>
  <rect x="200" y="348" width="217" height="18" class="esc"/>
  <text x="1070" y="363" class="small">0.765</text>

  <text x="40" y="405" class="small">sumamnt_ma_rech90</text>
  <rect x="200" y="388" width="850" height="18" class="barbg"/>
  <rect x="200" y="388" width="80" height="18" class="esc"/>
  <text x="1070" y="403" class="small">0.282</text>

  <text x="40" y="445" class="small">Drift is treated as an investigation signal, not proof of model failure.</text>
</svg>